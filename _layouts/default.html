<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} - {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="page">
    <div class="container">
      <header>
        <h1>{{ page.title }}</h1>
        {% if page.description %}
          <p>{{ page.description }}</p>
        {% endif %}
      </header>

      <main>
        {{ content }}
      </main>
    </div>

    <footer>
      <div class="footer-inner">
        <div class="footer-col">
          {{ page.site_copyright
            | markdownify
            | remove: '<p>'
            | remove: '</p>'
            | strip }}
          <a href="https://creativecommons.org/publicdomain/zero/1.0/">
            CC0 1.0 Universal
          </a>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
